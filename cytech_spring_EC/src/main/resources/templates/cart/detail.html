<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout :: layout(~{::title}, ~{::body/content()}, ~{::head})}">

<head>
	<meta charset="UTF-8">
	<title>カート詳細画面</title>
	<link th:href="@{/css/cart.css}" rel="stylesheet">
</head>

<body>
	<main class="cart-detail">
		<p class="cart-detail__title">カート詳細画面</p>
		
		<div class="cart-detail__container" th:each="cart : ${cartList}">
			
			<div class="cart-detail__item">
				<div class="cart-detail__img">
					<img th:src="@{${cart.product.imgPath}}" alt="商品画像">
				</div>
				
				<div class="cart-detail__info">
					<p th:text="'商品名：' + ${cart.product.productName}"></p>
					
					<label>数量：</label>
					<select>
						<option th:each="i : ${#numbers.sequence(1, cart.product.stock)}"
								th:value="${i}"
								th:text="${i}"
								th:selected="${cart.quantity == i}">
						</option>
					</select>
					
					<form th:action="@{/cart/delete}" method="post">
						<input type="hidden" name="cartId" th:value="${cart.cartId}">
						<button type="submit" class="detail-btn btn-delete">削除</button>
					</form>
					
					<p th:text="'価格：' + ${cart.product.price}"></p>
					<p th:text="'消費税込み金額：' + ${cart.product.taxPrice * cart.quantity}"></p>
				</div>
			</div>
			
			<div class="cart-detail__summary">
				<p th:text="'個数：' + ${cart.quantity}"></p>
				<p th:text="'金額：' + ${cart.product.price * cart.quantity}"></p>
				<p th:text="'消費税込み金額：' + ${cart.product.taxPrice * cart.quantity}"></p>
				
				<form th:action="@{/order/detail}" method="post">
					<input type="hidden" name="cartId" th:value="${cart.cartId}">
					<button type="submit" class="detail-btn btn-buy">レジに進む</button>
				</form>
			</div>
			
		</div>
	</main>
</body>
</html>
